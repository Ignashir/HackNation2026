# Serves the built Angular portal. Unknown paths fall back to index.html so deep links
# (e.g. /dataset/123) survive a page refresh.
server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed bundles never change; index.html must not be cached.
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
