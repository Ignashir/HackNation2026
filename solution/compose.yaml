services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_DB: aed
      POSTGRES_USER: aed
      POSTGRES_PASSWORD: ${AED_DB_PASSWORD:-aed}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - aed-data:/var/lib/postgresql/data
      - ./sql:/sql:ro
      - ./docker/initdb/20_aed_schema.sh:/docker-entrypoint-initdb.d/20_aed_schema.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aed -d aed"]
      interval: 5s
      retries: 30

volumes:
  aed-data:
